# GPU Interactive Session Configuration for 1D transformer
# Optimized for V100-32GB

# Model configuration
model-type: "1d"
model-size: "small"

# Data paths  
data-dir: "data/processed"
output-dir: "outputs/gpu_runs"

# Training configuration - optimized for V100
batch-size: 64               # Larger batch for V100-32GB
num-epochs: 20               # More epochs for better results
learning-rate: 0.0001
weight-decay: 0.01
warmup-epochs: 3             

# Training settings
use-class-weights: true
augment-train: true
mixed-precision: true        # Important for V100 efficiency
gradient-clip-val: 1.0

# Early stopping 
patience: 8                  
min-delta: 0.001

# Hardware
device: "cuda"               
num-workers: 4

# Logging
log-interval: 10             
save-best-only: true